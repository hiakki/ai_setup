name: Shared development quality tools
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: bash install.sh install --home "$RUNNER_TEMP/Quality home" --only quality,docs
      - name: Install on native Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1 -HomeDirectory "$env:RUNNER_TEMP/Quality home" -Only quality,docs
          if ($LASTEXITCODE -ne 0) { throw 'Quality installation failed' }
      - name: Repeat install and check POSIX workflows
        if: runner.os != 'Windows'
        shell: bash
        run: '"$RUNNER_TEMP/Quality home/.local/share/ai-setup/venv/bin/python" tests/check_quality.py --home "$RUNNER_TEMP/Quality home" --install'
      - name: Repeat install and check Windows workflows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/Quality home/.local/share/ai-setup/venv/Scripts/python.exe" tests/check_quality.py --home "$env:RUNNER_TEMP/Quality home" --install
          if ($LASTEXITCODE -ne 0) { throw 'Quality workflow checks failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-${{ matrix.os }}
          path: ${{ runner.temp }}/Quality home/.local/state/ai-setup/quality-report.json
          include-hidden-files: true
