name: Native Windows

on:
  pull_request:
  push:
    branches: [main, native-windows, task/native-windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          "AI_SETUP_TEST_HOME=$env:USERPROFILE" >> $env:GITHUB_ENV
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed' }
          New-Item -ItemType Directory -Force .work | Out-Null
      - name: Run isolated regression suite
        run: |
          & {
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression suite failed' }
          } 2>&1 | Tee-Object -FilePath .work/windows-unit.log
      - name: Install with Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\install.ps1 *>&1 |
            Tee-Object -FilePath .work/windows-install.log
          if ($LASTEXITCODE -ne 0) { throw 'Native installation failed' }
      - name: Verify the installed configuration
        run: |
          $python = Join-Path $env:AI_SETUP_TEST_HOME '.local/share/ai-setup/venv/Scripts/python.exe'
          & $python setup.py verify --home $env:AI_SETUP_TEST_HOME
          if ($LASTEXITCODE -ne 0) { throw 'Native configuration verification failed' }
      - name: Repeat install with PowerShell 7 to prove idempotence
        run: |
          & .\install.ps1 *>&1 |
            Tee-Object -FilePath .work/windows-repeat-install.log
          if ($LASTEXITCODE -ne 0) { throw 'Repeated native installation failed' }
      - name: Collect diagnostic evidence
        if: always()
        run: |
          $state = Join-Path $env:AI_SETUP_TEST_HOME '.local/state/ai-setup'
          $destination = '.work/windows-evidence'
          New-Item -ItemType Directory -Force $destination | Out-Null
          foreach ($name in @('smoke-report.json', 'smoke-fixture')) {
            $source = Join-Path $state $name
            if (Test-Path $source) { Copy-Item -Recurse -Force $source $destination }
          }
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsArchitecture |
            ConvertTo-Json | Set-Content "$destination/platform.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-windows-evidence
          path: |
            .work/windows-*.log
            .work/windows-evidence/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
