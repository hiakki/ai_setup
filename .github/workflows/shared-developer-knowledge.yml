name: Shared developer knowledge

on:
  pull_request:
    paths:
      - 'entire_runtime.py'
      - 'agentwiki_runtime.py'
      - 'agent_wiki_server.py'
      - 'setup.py'
      - 'hub.py'
      - 'manifest.json'
      - 'install.sh'
      - 'install.ps1'
      - 'tests/test_entire_runtime.py'
      - 'tests/test_agentwiki.py'
      - 'tests/test_agent_wiki_server.py'
      - '.github/workflows/shared-developer-knowledge.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clients:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      AGENT_WIKI_MCP_URL: https://wiki.example.test/api/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run focused regression tests
        run: python -m unittest tests.test_entire_runtime tests.test_agentwiki tests.test_agent_wiki_server -v
      - name: Install through POSIX entry point
        if: runner.os != 'Windows'
        shell: bash
        run: bash install.sh install --home "$RUNNER_TEMP/shared knowledge home" --only entire,agentwiki,hub,docs
      - name: Install through native Windows entry point
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1 -HomeDirectory "$env:RUNNER_TEMP/shared knowledge home" -Only 'entire,agentwiki,hub,docs'
          if ($LASTEXITCODE -ne 0) { throw 'Shared knowledge installation failed' }
      - name: Verify POSIX installation and Entire binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash install.sh verify --home "$RUNNER_TEMP/shared knowledge home"
          "$RUNNER_TEMP/shared knowledge home/.local/bin/entire" --version
          "$RUNNER_TEMP/shared knowledge home/.local/bin/ai-agent-wiki-server" --help
      - name: Verify Windows installation and Entire binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -Action verify -HomeDirectory "$env:RUNNER_TEMP/shared knowledge home"
          & "$env:RUNNER_TEMP/shared knowledge home/.local/bin/entire.exe" --version
          & "$env:RUNNER_TEMP/shared knowledge home/.local/bin/ai-agent-wiki-server.cmd" --help
          if ($LASTEXITCODE -ne 0) { throw 'Shared knowledge verification failed' }
