name: Shared Agent Reach installation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install and repeat on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash install.sh install --home "$RUNNER_TEMP/Reach home" --only agentreach
          "$RUNNER_TEMP/Reach home/.local/share/ai-setup/venv/bin/python" setup.py install --home "$RUNNER_TEMP/Reach home" --only agentreach
          "$RUNNER_TEMP/Reach home/.local/share/ai-setup/venv/bin/python" tests/check_agentreach.py --home "$RUNNER_TEMP/Reach home"
      - name: Install and repeat on native Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1 -HomeDirectory "$env:RUNNER_TEMP/Reach home" -Only agentreach
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed' }
          $python = "$env:RUNNER_TEMP/Reach home/.local/share/ai-setup/venv/Scripts/python.exe"
          & $python setup.py install --home "$env:RUNNER_TEMP/Reach home" --only agentreach
          if ($LASTEXITCODE -ne 0) { throw 'Repeat failed' }
          & $python tests/check_agentreach.py --home "$env:RUNNER_TEMP/Reach home"
          if ($LASTEXITCODE -ne 0) { throw 'Workflow checks failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agent-reach-${{ matrix.os }}
          path: ${{ runner.temp }}/Reach home/.local/state/ai-setup/agent-reach-report.json
          include-hidden-files: true
