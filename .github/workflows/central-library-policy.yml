name: Central library policy

on:
  workflow_call:
    inputs:
      base-sha:
        description: Approved base commit in the consuming repository
        required: true
        type: string
      library-ref:
        description: Published immutable ai_setup commit containing the policy checker
        required: true
        type: string

permissions:
  contents: read

jobs:
  central-library:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hiakki/ai_setup
          ref: ${{ inputs.library-ref }}
          path: .ai-setup-policy
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reject project-local library changes
        env:
          POLICY_BASE: ${{ inputs.base-sha }}
        run: python .ai-setup-policy/hub.py --home "$RUNNER_TEMP/policy-home" check-project --project "$GITHUB_WORKSPACE" --base "$POLICY_BASE"
