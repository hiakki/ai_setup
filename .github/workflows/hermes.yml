name: Hermes installation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hermes_runtime.py'
      - 'setup.py'
      - 'manifest.json'
      - 'custom/skills/hermes-workflows/**'
      - 'tests/test_hermes.py'
      - '.github/workflows/hermes.yml'

permissions:
  contents: read

jobs:
  hermes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_hermes.py -v
      - name: Install upstream Hermes for the runner user
        run: python setup.py install --only hermes
      - name: Repeat installation
        run: python setup.py install --only hermes
      - name: Verify installed ownership and configuration
        run: python setup.py verify
      - name: Verify actual shared-skill discovery
        shell: python
        run: |
          import json
          from pathlib import Path
          from setup import Installer, capture
          from hermes_runtime import launcher
          installer = Installer(Path.home(), json.loads(Path('manifest.json').read_text()))
          env = dict(installer.env, COLUMNS='240')
          output = capture([launcher(installer), 'skills', 'list', '--source', 'all'], env=env)
          assert 'hermes-workflows' in output, output
          print('PASS: Hermes discovers the installed shared adapter')
