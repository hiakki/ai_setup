name: Design skills and Context Mode
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bootstrap through POSIX launcher
        if: runner.os != 'Windows'
        shell: bash
        run: bash install.sh install --home "$RUNNER_TEMP/Design tools home" --only contextmode
      - name: Bootstrap through native Windows launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1 -HomeDirectory "$env:RUNNER_TEMP/Design tools home" -Only contextmode
          if ($LASTEXITCODE -ne 0) { throw 'Context Mode installation failed' }
      - name: Verify providers and repeat installation on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: '"$RUNNER_TEMP/Design tools home/.local/share/ai-setup/venv/bin/python" tests/check_design_context.py --home "$RUNNER_TEMP/Design tools home" --install'
      - name: Verify providers and repeat installation on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/Design tools home/.local/share/ai-setup/venv/Scripts/python.exe" tests/check_design_context.py --home "$env:RUNNER_TEMP/Design tools home" --install
          if ($LASTEXITCODE -ne 0) { throw 'Provider workflow checks failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: design-context-${{ matrix.os }}
          path: ${{ runner.temp }}/Design tools home/.local/state/ai-setup/design-context-report.json
          include-hidden-files: true
