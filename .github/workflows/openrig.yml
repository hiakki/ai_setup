name: Shared OpenRig installation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit checks
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p test_openrig.py -v
      - name: Install and repeat on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash install.sh install --home "$RUNNER_TEMP/Team home" --only openrig
          "$RUNNER_TEMP/Team home/.local/share/ai-setup/venv/bin/python" setup.py install --home "$RUNNER_TEMP/Team home" --only openrig
      - name: Install and repeat Windows SSH entrypoint
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1 -HomeDirectory "$env:RUNNER_TEMP/Team home" -Only openrig
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed' }
          $python = "$env:RUNNER_TEMP/Team home/.local/share/ai-setup/venv/Scripts/python.exe"
          & $python setup.py install --home "$env:RUNNER_TEMP/Team home" --only openrig
          if ($LASTEXITCODE -ne 0) { throw 'Repeat failed' }
          & "$env:RUNNER_TEMP/Team home/.local/bin/ai-team.cmd" roles
          if ($LASTEXITCODE -ne 0) { throw 'Native entrypoint failed' }
  debian:
    runs-on: ubuntu-24.04
    container: python:3.12-slim-bookworm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install and repeat on Debian
        shell: bash
        run: |
          bash install.sh install --home /tmp/team-home --only openrig
          /tmp/team-home/.local/share/ai-setup/venv/bin/python setup.py install --home /tmp/team-home --only openrig
